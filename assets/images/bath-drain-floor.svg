<text x="70" y="92" font-family="Arial,sans-serif" font-weight="700" font-size="43" fill="#202b30">Проливной пол: разрез</text><text x="70" y="130" font-family="Arial,sans-serif" font-size="21" fill="#526067">Вода не должна попадать на открытый грунт и деревянные несущие элементы</text>
