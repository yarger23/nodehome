name: Create 9 pending NodeHome covers (temporary)
on:
  push:
    branches: [content/2026-11-03-pending-18]
    paths: [.github/workflows/generate-pending-18.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: {batch: [0,1,2]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests Pillow
      - run: python scripts/tmp-generate-pending-photos.py --batch ${{ matrix.batch }}
      - uses: actions/upload-artifact@v4
        with:
          name: pending-photos-${{ matrix.batch }}
          path: generated-pending-covers/*.webp
          if-no-files-found: error
          retention-days: 1
  save:
    runs-on: ubuntu-latest
    needs: [render]
    steps:
      - uses: actions/checkout@v4
        with: {ref: content/2026-11-03-pending-18, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: pending-photos-*
          path: generated-pending-covers
          merge-multiple: true
      - name: Verify images and unique bytes
        run: |
          python - <<'PY'
          import pathlib,hashlib
          imgs=list(pathlib.Path('generated-pending-covers').glob('*.webp'))
          assert len(imgs)==9,len(imgs)
          assert len({hashlib.sha256(p.read_bytes()).digest() for p in imgs})==9
          assert all(p.stat().st_size>=25000 and p.read_bytes()[:4]==b'RIFF' for p in imgs)
          print('PASS 9 original photos')
          PY
      - name: Commit files to work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p assets/images
          cp generated-pending-covers/*.webp assets/images/
          git add assets/images/
          git diff --cached --quiet && { echo 'No new photos'; exit 1; }
          git commit -m "assets: add nine original covers for pending articles"
          git push origin HEAD:content/2026-11-03-pending-18
