name: Generate November 1 original photos (temporary)
on:
  push:
    branches: [content/2026-11-03-backlog-36]
    paths: [.github/workflows/generate-nov-36.yml]
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {batch: [0, 1, 2, 3]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests Pillow
      - name: Produce 8 photos with unique prompts
        run: python scripts/tmp-create-36-covers.py --batch ${{ matrix.batch }}
      - uses: actions/upload-artifact@v4
        with:
          name: nov-covers-batch-${{ matrix.batch }}
          path: generated-covers/*.webp
          if-no-files-found: error
          retention-days: 1
  commit:
    runs-on: ubuntu-latest
    needs: [photos]
    steps:
      - uses: actions/checkout@v4
        with: {ref: content/2026-11-03-backlog-36, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: nov-covers-batch-*
          path: generated-covers
          merge-multiple: true
      - name: Validate generated photos
        run: |
          python - <<'PY'
          import pathlib,hashlib
          files=list(pathlib.Path("generated-covers").glob("*.webp"))
          assert len(files)==32, f"Expected 32 original photographs, got {len(files)}"
          hashes={hashlib.sha256(x.read_bytes()).hexdigest() for x in files}
          assert len(hashes)==32, "Duplicate image content"
          for f in files:
              b=f.read_bytes()
              assert len(b)>=25000 and b[:4]==b"RIFF" and b[8:12]==b"WEBP", f.name
          print("32 unique photographic WebP files validated")
          PY
      - name: Commit images to source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p assets/images
          cp generated-covers/*.webp assets/images/
          git add assets/images/
          git diff --cached --quiet && { echo 'No new images'; exit 1; }
          git commit -m "assets: add 32 unique photorealistic covers for November articles"
          git push origin HEAD:content/2026-11-03-backlog-36
