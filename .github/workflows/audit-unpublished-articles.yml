name: Audit unpublished NodeHome content (temporary)
on:
  push:
    branches:
      - audit/2026-11-03-pending-articles
    paths:
      - .github/workflows/audit-unpublished-articles.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Summarize all article statuses and draft readiness
        run: |
          python3 - <<'PY'
          import json, pathlib, collections, subprocess, datetime
          base=pathlib.Path('content/articles')
          articles=[]
          for path in base.glob('*.json'):
              try:
                  a=json.loads(path.read_text('utf8'))
              except Exception as e:
                  print('MALFORMED:',path,str(e));continue
              slug=a.get('slug')
              image=a.get('image')
              src=pathlib.Path('assets/images')/str(image)
              page=pathlib.Path('site/article')/str(slug)/'index.html'
              row=dict(
                  slug=slug, title=a.get('title'), status=a.get('status'),
                  image=image,imageExists=src.is_file(),imageBytes=src.stat().st_size if src.is_file() else None,
                  pageExists=page.is_file(),sections=len(a.get('sections',[])),
                  faqs=len(a.get('faqs',[])),publishedAt=a.get('publishedAt'),
                  path=str(path),category=a.get('categoryIds'))
              if row['status']!='published':
                  log=subprocess.run(['git','log','--diff-filter=A','--format=%aI','--',str(path)],capture_output=True,text=True)
                  row['addedToGit']=log.stdout.strip().splitlines()[0] if log.stdout.strip() else None
              articles.append(row)
          legacy=json.loads(pathlib.Path('content/articles.json').read_text('utf8'))
          statuses=collections.Counter(x.get('status','MISSING') for x in articles)
          print('=== INVENTORY ===')
          print(json.dumps(dict(totalIndividual=len(articles),statusCounts=dict(statuses),legacyArticles=len(legacy),missingPublishedPages=sum(x['status']=='published' and not x['pageExists'] for x in articles)),ensure_ascii=False))
          print('=== ALL NOT-PUBLISHED ARTICLES ===')
          for row in sorted([x for x in articles if x['status']!='published'],key=lambda a:(a.get('addedToGit') or '',a.get('slug') or '')):
              print(json.dumps(row,ensure_ascii=False))
          print('=== PUBLISHED WITHOUT HTML ===')
          for row in articles:
              if row['status']=='published' and not row['pageExists']:
                  print(json.dumps(row,ensure_ascii=False))
          print('=== RECENT PUBLISHED ARTICLES (created since Nov 2 UTC, visible timestamps) ===')
          for row in articles:
              if row.get('publishedAt') in ('2026-11-02','2026-11-03'):
                  print(json.dumps({k:row.get(k) for k in ('slug','status','publishedAt','pageExists')},ensure_ascii=False))
          PY