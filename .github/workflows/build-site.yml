name: Build Nodehome static site
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/build-site.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download licensed editorial photos
        run: |
          curl --fail --location --retry 3 'https://images.unsplash.com/photo-1757937176646-d943553b5f09?fm=jpg&fit=crop&w=1500&h=1000&q=83' -o assets/images/bath-photo-cover.jpg
          curl --fail --location --retry 3 'https://images.unsplash.com/photo-1774876549571-32d7b9051ddf?fm=jpg&fit=crop&w=1500&h=1000&q=83' -o assets/images/bath-photo-inside.jpg
          curl --fail --location --retry 3 'https://images.unsplash.com/photo-1759302354553-cf87ceb9135c?fm=jpg&fit=crop&w=1500&h=1000&q=83' -o assets/images/sauna-stove-wood-electric-cover.jpg
          file assets/images/sauna-stove-wood-electric-cover.jpg assets/images/bath-photo-cover.jpg assets/images/bath-photo-inside.jpg
          curl --fail --location --retry 3 'https://images.unsplash.com/photo-1770625467514-f072c8a64a8c?fm=jpg&fit=crop&w=1500&h=1000&q=83' -o assets/images/bath-ceiling-insulation.jpg
      - name: Download vapor barrier photo
        run: |
          curl --fail --location --retry 3 --user-agent 'Nodehome Editorial/1.0 (https://nodehome.ru)' 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Aluminum_foil_sauna_vapor_barrier.jpg/1280px-Aluminum_foil_sauna_vapor_barrier.jpg' -o assets/images/sauna-vapor-barrier.jpg
          file assets/images/sauna-vapor-barrier.jpg
      - name: Validate and generate
        run: |
          node --check scripts/build.mjs
          node --check assets/site.js
          node scripts/build.mjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/ assets/images/bath-photo-cover.jpg assets/images/bath-photo-inside.jpg assets/images/bath-ceiling-insulation.jpg assets/images/sauna-stove-wood-electric-cover.jpg
          git add -A assets/images/sauna-vapor-barrier.jpg
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate published Nodehome pages"
            git push origin HEAD:main
          fi
