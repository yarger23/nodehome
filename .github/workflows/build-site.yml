name: Build Nodehome static site
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/build-site.yml"

# Process content updates in order, preventing races between generated commits.
concurrency:
  group: nodehome-site-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preflight new articles BEFORE site generation
        env:
          NODEHOME_BASE_SHA: ${{ github.event.before }}
        run: |
          node --check scripts/preflight-new-articles.mjs
          node scripts/preflight-new-articles.mjs
      - name: Validate and generate
        run: |
          node --check scripts/build.mjs
          node --check assets/site.js
          node scripts/build.mjs
      - name: Verify HTML and approved images for changed articles
        env:
          NODEHOME_BASE_SHA: ${{ github.event.before }}
        run: node scripts/preflight-new-articles.mjs --verify-built
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Do not touch archived article sources or older cover images.
          git add -A site/
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate published Nodehome pages"
            git push origin HEAD:main
          fi
