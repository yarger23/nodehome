name: Generate ten winter article photos (temporary)
on:
  push:
    branches:
      - content/2026-11-02-winter-seo-ten
    paths:
      - .github/workflows/generate-winter-covers.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/2026-11-02-winter-seo-ten
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests Pillow
      - name: Generate unique original photorealistic covers
        run: |
          python - <<'PY'
          import io,json,hashlib,os,time,requests
          from PIL import Image, ImageFilter, ImageStat
          prefix='content/articles/'
          slugs=[
          ('kakoy-obogrevatel-luchshe-dlya-kvartiry','Editorial architectural interior photograph of three types of portable electric heaters: slim white panel convector, realistic ivory oil radiator, and a small black ceramic fan heater side by side on wooden apartment floor, none plugged in, neutral room, crisp photorealistic camera shot, safe open space'),
          ('pochemu-poteyut-plastikovye-okna-zimoy','Close-up documentary photograph of realistic condensation water droplets on inside surface of clean white PVC double-glazed window in winter, snowy courtyard beyond, natural cool diffused daylight, visibly damp glass and dry windowsill, no people'),
          ('pochemu-doma-holodno-hotya-batarei-goryachie','Modern bright Russian apartment living room with white hot-water radiator under large winter window, snow outdoors, wool blanket on sofa far from heater, muted daylight, realistic architectural photography'),
          ('vlazhnost-vozduha-v-kvartire-zimoy','Elegant compact white electronic home thermometer hygrometer on a wooden console near indoor plant, beautiful airy winter apartment with daylight, photorealistic editorial macro photography, no writing overlay'),
          ('mozhno-li-delat-remont-zimoy','Realistic interior renovation photograph of a tidy partially painted apartment wall beside snowy window, paint roller and tray on protective floor cover, bucket, stepladder in background, correct realistic construction tools and textures'),
          ('kak-vybrat-novogodnyuyu-girlyandu-dlya-doma','Close-up photorealistic product still life of a warm white LED fairy string light safely arranged on wooden table near evergreen branches, evening cozy bokeh with attractive Christmas colors, no text'),
          ('kak-ukrasit-malenkuyu-kvartiru-k-novomu-godu','Small modern apartment decorated for New Year with a tasteful compact tabletop pine tree, restrained warm white fairy lights, red cushions and wreath, uncluttered walkways, natural cozy editorial interior photograph'),
          ('khranenie-zimney-odezhdy-i-obuvi-v-malenkoy-kvartire','Neatly organized narrow Russian apartment entryway closet, winter puffer jackets on coat hangers, orderly winter boots on floor tray, labeled-looking plain storage baskets with no text, mittens and scarves, photorealistic'),
          ('kakie-shtory-luchshe-sokhranyayut-teplo-zimoy','Photorealistic close architectural interior view of rich textured heavyweight warm grey insulated curtains pulled partly over a tall window with snow outside, radiator unblocked and visible below window, cozy bedroom'),
          ('kak-sdelat-temnuyu-komnatu-svetlee','Bright warm modern living room with pale walls, large uncovered window, multiple soft light sources and floor lamp, strategically placed light furniture, natural authentic editorial interior design photo')]
          url='https://stable-diffusion-xl.endpoints.kepler.ai.cloud.ovh.net/api/text2image'
          os.makedirs('assets/images',exist_ok=True)
          sha=set()
          for i,(slug,description) in enumerate(slugs,1):
              print(f'Generating {i}/10: {slug}',flush=True)
              payload={'prompt':description+'. High quality editorial real-life photography, camera sensor textures, photorealistic 35mm lens, no lettering, no collage, no watermark, landscape composition.', 'negative_prompt':'text, lettering, collage, grid, watermark, low quality, distorted objects, blurry, screenshot, CGI'}
              resp=None
              for attempt in range(3):
                  try: 
                      resp=requests.post(url,json=payload,headers={'accept':'application/octet-stream','Content-Type':'application/json'},timeout=140)
                  except requests.RequestException as exc:
                      print('network retry',str(exc)[:150],flush=True);time.sleep(15);continue
                  if resp.status_code==200:break
                  print('provider error',resp.status_code,resp.text[:200],flush=True)
                  if resp.status_code in (400,401,402,403,404):raise RuntimeError(f'Provider unavailable or permission required: {resp.status_code}')
                  time.sleep(30)
              if resp is None or resp.status_code!=200:raise RuntimeError('Provider failed for '+slug)
              img=Image.open(io.BytesIO(resp.content)).convert('RGB')
              if min(img.size)<768:raise RuntimeError('Image resolution too small '+str(img.size))
              w,h=img.size
              # Crop to 3:2 while retaining native area of subject, then enlarge mildly for site delivery.
              target_ratio=1.5
              if w/h>target_ratio:
                  new_w=int(h*target_ratio);img=img.crop(((w-new_w)//2,0,(w+new_w)//2,h))
              else:
                  new_h=int(w/target_ratio);img=img.crop((0,(h-new_h)//2,w,(h+new_h)//2))
              img=img.resize((1600,1067),Image.Resampling.LANCZOS)
              img=img.filter(ImageFilter.UnsharpMask(radius=1.2,percent=110,threshold=3))
              path='assets/images/'+slug+'-hero.webp'
              img.save(path,format='WEBP',quality=85,method=6)
              b=open(path,'rb').read()
              if len(b)<25000 or len(b)>1000000:raise RuntimeError('Bad compressed size '+str(len(b)))
              hash_=hashlib.sha256(b).hexdigest()
              if hash_ in sha:raise RuntimeError('Duplicate image')
              sha.add(hash_)
              print(f'Generated {path} {len(b)} bytes sha={hash_[:14]}',flush=True)
              time.sleep(32 if i<10 else 0)
          print('All 10 original photos generated',flush=True)
          PY
      - name: Commit images only to draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/*-hero.webp
          git diff --cached --quiet && { echo 'No photos generated'; exit 1; }
          git commit -m "assets: generate 10 original winter article covers"
          git push origin HEAD:content/2026-11-02-winter-seo-ten
