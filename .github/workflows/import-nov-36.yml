name: Import November 1 backlog (temporary)
on:
  push:
    branches: [content/2026-11-03-backlog-36]
    paths: [.github/workflows/import-nov-36.yml]
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Convert and register texts, skipping near-duplicate topics
        run: python scripts/tmp-import-36.py
      - name: Show article inventory
        run: |
          python - <<'PY'
          import json
          a=json.load(open('tmp/nov-01-import-report.json'))
          assert len(a)==36 and sum(x['status']=='published' for x in a)==32
          print('Imported:',len(a),'Ready:',sum(x['status']=='published' for x in a))
          PY
      - name: Commit only content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/categories.json content/articles/
          git commit -m "content: import 36 ready November texts, hold 4 overlapping topics"
          git push origin HEAD:content/2026-11-03-backlog-36

