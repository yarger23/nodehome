name: Validate November 36 articles and images (temporary)
on:
  push:
    branches: [content/2026-11-03-backlog-36]
    paths: [.github/workflows/validate-nov-36.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Audit 36 articles and 32 original photographs
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          src=pathlib.Path("content/articles")
          candidates=[p for p in src.glob("*.json") if json.loads(p.read_text()).get("id","").startswith("nov-01-seo-")]
          pubs=[p for p in candidates if json.loads(p.read_text())["status"]=="published"]
          drafts=[p for p in candidates if json.loads(p.read_text())["status"]=="draft"]
          assert len(candidates)==36 and len(pubs)==32 and len(drafts)==4,(len(candidates),len(pubs),len(drafts))
          images=[pathlib.Path("assets/images")/(json.loads(p.read_text())["image"]) for p in pubs]
          assert all(i.exists() for i in images)
          assert len({hashlib.sha256(p.read_bytes()).digest() for p in images})==32
          print("Inventory OK: 36 articles, 32 published, 4 held, 32 unique images")
          PY
      - name: Preflight added article JSON before generating site
        run: |
          BASE=$(git merge-base origin/main HEAD)
          node --check scripts/preflight-new-articles.mjs
          NODEHOME_BASE_SHA="$BASE" node scripts/preflight-new-articles.mjs
      - name: Generate static site
        run: |
          node --check scripts/build.mjs
          node --check assets/site.js
          node scripts/build.mjs
      - name: Verify published HTML pages and copied covers
        run: |
          BASE=$(git merge-base origin/main HEAD)
          NODEHOME_BASE_SHA="$BASE" node scripts/preflight-new-articles.mjs --verify-built
      - name: Confirm 32 article URLs generated
        run: |
          python - <<'PY'
          import json,pathlib
          pubs=[json.loads(p.read_text()) for p in pathlib.Path("content/articles").glob("*.json") if p.name and json.loads(p.read_text()).get("id","").startswith("nov-01-seo-") and json.loads(p.read_text()).get("status")=="published"]
          for a in pubs:
              path=pathlib.Path("site/article")/a["slug"]/"index.html"
              assert path.exists(),str(path)
          print("PASS: all",len(pubs),"new pages generated with canonical and photos checked separately")
          PY
