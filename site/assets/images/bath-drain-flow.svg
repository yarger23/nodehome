<text x="925" y="228" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#203138">Канализация</text><text x="900" y="265" font-family="Arial,sans-serif" font-size="18" fill="#526067">При доступном</text><text x="900" y="292" font-family="Arial,sans-serif" font-size="18" fill="#526067">подключении</text>
<rect x="874" y="369" width="263" height="143" rx="16" fill="#ffffff" stroke="#cad1ca" stroke-width="3"/><circle cx="902" cy="401" r="10" fill="#448d7e"/>
<text x="925" y="408" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#203138">Накопитель</text><text x="900" y="447" font-family="Arial,sans-serif" font-size="18" fill="#526067">Герметичная ёмкость</text><text x="900" y="475" font-family="Arial,sans-serif" font-size="18" fill="#526067">с откачкой</text>
<rect x="874" y="548" width="263" height="143" rx="16" fill="#ffffff" stroke="#cad1ca" stroke-width="3"/><circle cx="902" cy="580" r="10" fill="#448d7e"/>
<text x="925" y="588" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#203138">Очистка</text><text x="900" y="624" font-family="Arial,sans-serif" font-size="18" fill="#526067">Септик / ЛОС</text><text x="900" y="653" font-family="Arial,sans-serif" font-size="17" fill="#526067">с допустимым выпуском</text>
<rect x="69" y="526" width="705" height="165" rx="16" fill="#e9e5da"/>
<text x="98" y="571" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#513f29">Важно</text>
<text x="98" y="612" font-family="Arial,sans-serif" font-size="21" fill="#584c3d">Нельзя просто сливать моющие стоки</text>
<text x="98" y="645" font-family="Arial,sans-serif" font-size="21" fill="#584c3d">в грунт под полом или рядом с фундаментом.</text>
<text x="70" y="752" font-family="Arial,sans-serif" font-size="17" fill="#66736f">NODEHOME · принципиальная схема, не рабочий проект</text>
