<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
<title id="t">Схемы отвода воды из бани</title><desc id="d">От мокрого пола через трап и герметичную канализационную трубу до центральной канализации, герметичного накопителя либо подобранной системы очистки.</desc>
<rect width="1200" height="800" rx="24" fill="#f5f3ef"/>
<text x="70" y="92" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#202b30">Куда уходит вода из бани</text><text x="70" y="137" font-family="Arial,sans-serif" font-size="22" fill="#586267">Сбор воды в помещении и приём стоков на участке — разные задачи</text>
<rect x="70" y="208" width="275" height="160" rx="17" fill="#ffffff" stroke="#d7d9d5" stroke-width="3"/>
