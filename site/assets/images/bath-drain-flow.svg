<text x="92" y="245" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#202b30">Моечная</text><text x="92" y="273" font-family="Arial,sans-serif" font-size="19" fill="#59676a">Пол → трап</text>
<path d="M345 287 H470" stroke="#497d91" stroke-width="9" fill="none"/><path d="M453 271 l26 16 -26 16" fill="none" stroke="#497d91" stroke-width="9" stroke-linejoin="round"/>
