<text x="514" y="252" font-family="Arial,sans-serif" font-weight="700" font-size="25" fill="#20383f">Отводящая труба</text><text x="514" y="291" font-family="Arial,sans-serif" font-size="21" fill="#35525a">Уклон без провисов</text><text x="514" y="326" font-family="Arial,sans-serif" font-size="19" fill="#35525a">Ревизия при необходимости</text>
<path d="M774 289 H830" stroke="#497d91" stroke-width="9" fill="none"/><path d="M830 289 V250 M830 289 V436 M830 289 V628" stroke="#497d91" stroke-width="7" fill="none"/>
